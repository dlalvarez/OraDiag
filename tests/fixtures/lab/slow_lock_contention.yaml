schema_version: "1.0"
scenario:
  id: slow_lock_contention
  name: "Lentitud por bloqueo simulado"
  symptom: slow_performance
  target_id: lab_orcl_01
  profile: diag_all
target:
  target_id: lab_orcl_01
  display_name: "Laboratorio ORCL 01"
  environment: lab
  metadata:
    host_alias: lab-db-01
provider:
  provider_type: fixture
  provider_name: FixtureEvidenceProvider
  source_ref: tests/fixtures/lab/slow_lock_contention.yaml
access_layers:
  - name: database
    available: true
    status: OK
  - name: storage
    available: true
    status: OK
reviews:
  - check_id: locks
    title: "Bloqueos y contencion"
    status: PROBLEM
    severity: critical
  - check_id: storage_space
    title: "Espacio de almacenamiento"
    status: OK
    severity: info
    ok_relevance: "El almacenamiento simulado no explica la lentitud."
observations:
  - id: obs-locks-001
    check_id: locks
    subject:
      kind: session_group
      id: blocking_sessions
      name: "Sesiones bloqueantes simuladas"
      attributes:
        sample_count: 4
    status: CRITICAL
    severity: critical
    polarity: positive
    candidate_domain: database
    message: "Se observan sesiones bloqueadas y espera compatible con contencion de base de datos."
    structured_data:
      wait_class: application
      blocked_sessions: 7
      related_to_symptom: true
limitations: []
expected_output:
  assessment:
    status: determined
    domain: database
expected_diagnosis:
  primary_domain: database

